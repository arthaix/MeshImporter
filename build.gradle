plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'ru.arthaix.meshimporter'
version = '1.0.0'
archivesBaseName = 'meshimporter'

// Minecraft 1.12.2 needs Java 8 bytecode (FML's ASM cannot read newer class files)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Dev'
    extraRunJvmArguments.add('-Xmx4G')
}

repositories {
    mavenCentral()
}

dependencies {
    // MixinBooter (Sponge Mixin) for the optional LittleTiles placement tweak; the modpack provides it at runtime
    compileOnly files('libs/mixinbooter-10.7.jar')
    // JourneyMap's client API for the optional map overlay; the modpack provides it at runtime
    compileOnly files('libs/journeymap_1.12.2_5.7.1.jar')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft.mcVersion.get()
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': minecraft.mcVersion.get()
    }
}
